<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZAKURO AR</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>body{margin:0;font-family:sans-serif;background:#f4efe8}h1{font-size:18px;padding:12px 16px;margin:0}model-viewer{width:100%;height:360px;background:#e9e1d5;margin-bottom:8px}p{margin:4px 16px 18px;font-size:14px}</style></head><body>
<h1>ZAKURO AR テスト</h1>
<model-viewer src="kilim_blue_120x180.glb" ios-src="kilim_blue_120x180.usdz" ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="fixed" camera-controls disable-zoom disable-pan></model-viewer><p>120×180cm（実物大・拡大縮小なし）</p>
<model-viewer src="rug_navy_50x80.glb" ios-src="rug_navy_50x80.usdz" ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="fixed" camera-controls disable-zoom disable-pan></model-viewer><p>50×80cm（実物大・拡大縮小なし）</p>
<model-viewer src="kilim_sky_60x90.glb" ios-src="kilim_sky_60x90.usdz" ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="fixed" camera-controls disable-zoom disable-pan></model-viewer><p>60×90cm（実物大・拡大縮小なし）</p>
</body></html>
